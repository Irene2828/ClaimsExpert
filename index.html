<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Per-page SEO tags (title, description, canonical, hreflang, Open Graph, Twitter, JSON-LD)
         are injected below at build time by scripts/prerender.mjs from src/seo/*.
         Single source of truth: src/seo/site.js (business facts) and src/seo/pages.js (titles/descriptions). -->
    <!--app-head-->

    <!-- Performance: Lean Font Loading (Only Inter and Newsreader) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&display=swap"
      rel="stylesheet"
    />

    <!-- Animation initial state with reduced motion and noscript fallbacks -->
    <style id="premium-motion-init">
      #hero .z-10,
      #hero .hero-img-col,
      #hero .hero-quote-card,
      header nav a {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        #hero .z-10,
        #hero .hero-img-col,
        #hero .hero-quote-card,
        header nav a {
          opacity: 1 !important;
          transform: none !important;
          transition: none !important;
        }
      }
    </style>
    <noscript>
      <style>
        #hero .z-10,
        #hero .hero-img-col,
        #hero .hero-quote-card,
        header nav a {
          opacity: 1 !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
